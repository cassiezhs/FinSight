name: Daily FinSight Data Refresh v2

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'FinSight/0.1 contact@example.com' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          FINSIGHT_START_DATE: ${{ vars.FINSIGHT_START_DATE || '2018-01-01' }}
          FINSIGHT_END_DATE: ${{ vars.FINSIGHT_END_DATE || 'today' }}
          FINSIGHT_DAILY_REFRESH_DAYS: ${{ vars.FINSIGHT_DAILY_REFRESH_DAYS || '10' }}
          FINSIGHT_START_YEAR: ${{ vars.FINSIGHT_START_YEAR || '2018' }}
          FINSIGHT_END_YEAR: ${{ vars.FINSIGHT_END_YEAR || '2026' }}
          FINSIGHT_TICKERS: ${{ vars.FINSIGHT_TICKERS || 'AAPL,MSFT,NVDA' }}

          FINSIGHT_DAILY_LOAD_8K: "1"
          FINSIGHT_DAILY_LOAD_10K_SECTIONS: "0"
        run: python data_ingestiion/daily_refresh.py
